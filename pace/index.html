<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Pace Converter | Jack Weatherilt</title>
    <meta
      name="description"
      content="Convert running pace between min/km and min/mile."
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>J</text></svg>">
    <style>
      :root {
        --pace-card-bg: #ffffff;
        --pace-card-border: #e5e7eb;
        --pace-input-text: #111111;
        --pace-placeholder: #c7c9cd;
        --pace-unit: #6b7075;
        --pace-accent: rgb(107, 193, 215);
        --pace-accent-hover: rgb(82, 173, 198);
        --pace-caret: rgb(107, 193, 215);
        --pace-label: #111111;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --pace-card-bg: #232323;
          --pace-card-border: #2f2f2f;
          --pace-input-text: #f5f5f5;
          --pace-placeholder: #4a4d52;
          --pace-unit: #9aa0a6;
          --pace-label: #f5f5f5;
        }
      }

      .pace-wrap {
        box-sizing: border-box;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem 1.5rem 10rem 1.5rem;
        gap: 0;
      }

      .pace-card-stack {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
      }

      .pace-label {
        font-size: 15px;
        font-weight: 600;
        color: var(--pace-label);
        margin-bottom: 0.5rem;
      }

      .pace-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        background: var(--pace-card-bg);
        border: 1px solid var(--pace-card-border);
        border-radius: 16px;
        padding: 1rem 1.25rem;
      }

      .pace-input {
        flex: 1 1 auto;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: none;
        font-size: 32px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--pace-input-text);
        caret-color: var(--pace-caret);
        letter-spacing: -0.01em;
        line-height: 1;
        padding: 0;
        font-family: inherit;
      }

      .pace-input::placeholder {
        color: var(--pace-placeholder);
      }

      .pace-result {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 32px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--pace-input-text);
        letter-spacing: -0.01em;
        line-height: 1;
      }

      .pace-unit {
        flex: 0 0 auto;
        font-size: 17px;
        font-weight: 600;
        color: var(--pace-label);
      }

      .pace-swap-wrap {
        display: flex;
        justify-content: center;
        padding: 1rem 0;
      }

      .pace-swap {
        appearance: none;
        border: 0;
        cursor: pointer;
        height: 48px;
        width: 48px;
        border-radius: 9999px;
        background: var(--pace-accent);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        transition: transform 150ms ease, background 150ms ease;
      }

      .pace-swap:hover {
        background: var(--pace-accent-hover);
      }

      .pace-swap:active {
        transform: scale(0.95);
      }

      .pace-swap:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 3px;
      }

      .pace-swap svg {
        width: 20px;
        height: 20px;
      }

      .pace-stats {
        margin-top: 2rem;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.5rem;
      }

      .pace-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
        padding: 0.875rem 0.5rem;
        background: var(--pace-card-bg);
        border: 1px solid var(--pace-card-border);
        border-radius: 12px;
      }

      .pace-stat-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--pace-unit);
      }

      .pace-stat-value {
        font-size: 16px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--pace-input-text);
        letter-spacing: -0.01em;
        line-height: 1;
      }

      @media (max-width: 380px) {
        .pace-stats {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .pace-back {
        margin-top: 2.5rem;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <main class="pace-wrap">
      <div class="pace-card-stack">
        <p class="pace-label">Pace</p>
        <div class="pace-row">
          <input
            id="pace-input"
            class="pace-input"
            value="5:30"
            placeholder="0:00"
            maxlength="6"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
          />
          <span id="from-unit" class="pace-unit">min/km</span>
        </div>

        <div class="pace-swap-wrap">
          <button id="swap" class="pace-swap" aria-label="Swap units">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m21 16-4 4-4-4"/>
              <path d="M17 20V4"/>
              <path d="m3 8 4-4 4 4"/>
              <path d="M7 4v16"/>
            </svg>
          </button>
        </div>

        <p class="pace-label">Converted to</p>
        <div class="pace-row">
          <div id="pace-result" class="pace-result">8:51</div>
          <span id="to-unit" class="pace-unit">min/mile</span>
        </div>

        <div class="pace-stats" id="pace-stats">
          <div class="pace-stat">
            <span class="pace-stat-label">5K</span>
            <span class="pace-stat-value" data-stat="5k">--:--</span>
          </div>
          <div class="pace-stat">
            <span class="pace-stat-label">10K</span>
            <span class="pace-stat-value" data-stat="10k">--:--</span>
          </div>
          <div class="pace-stat">
            <span class="pace-stat-label">13.1</span>
            <span class="pace-stat-value" data-stat="half">--:--</span>
          </div>
          <div class="pace-stat">
            <span class="pace-stat-label">26.2</span>
            <span class="pace-stat-value" data-stat="full">--:--</span>
          </div>
        </div>

        <p class="pace-back grey">
          <a href="/">← back</a>
        </p>
      </div>
    </main>

    <script>
      (function () {
        var KM_IN_MILE = 1.60934;
        var input = document.getElementById('pace-input');
        var result = document.getElementById('pace-result');
        var fromUnit = document.getElementById('from-unit');
        var toUnit = document.getElementById('to-unit');
        var swapBtn = document.getElementById('swap');
        var isKmToMile = true;

        function parsePace(str) {
          var s = (str || '').trim();
          if (!s) return null;
          var parts = s.split(':');
          if (parts.length > 2) return null;
          var m = parseInt(parts[0], 10);
          var sec = parts.length === 2 ? parseInt(parts[1], 10) : 0;
          if (isNaN(m) || m < 0) return null;
          if (isNaN(sec) || sec < 0 || sec > 59) return null;
          return m * 60 + sec;
        }

        function formatPace(totalSeconds) {
          if (totalSeconds === null || isNaN(totalSeconds) || totalSeconds <= 0) {
            return '--:--';
          }
          var m = Math.floor(totalSeconds / 60);
          var s = Math.round(totalSeconds % 60);
          if (s === 60) { m += 1; s = 0; }
          return m + ':' + (s < 10 ? '0' + s : '' + s);
        }

        function formatDuration(totalSeconds) {
          if (totalSeconds === null || isNaN(totalSeconds) || totalSeconds <= 0) {
            return '--:--';
          }
          var rounded = Math.round(totalSeconds);
          var h = Math.floor(rounded / 3600);
          var m = Math.floor((rounded % 3600) / 60);
          var s = rounded % 60;
          var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
          if (h > 0) return h + ':' + pad(m) + ':' + pad(s);
          return m + ':' + pad(s);
        }

        var STATS = [
          { sel: '[data-stat="5k"]', km: 5 },
          { sel: '[data-stat="10k"]', km: 10 },
          { sel: '[data-stat="half"]', km: 13.1 * KM_IN_MILE },
          { sel: '[data-stat="full"]', km: 26.2 * KM_IN_MILE }
        ];

        function updateStats(secondsPerKm) {
          for (var i = 0; i < STATS.length; i++) {
            var el = document.querySelector(STATS[i].sel);
            if (!el) continue;
            if (secondsPerKm === null) {
              el.textContent = '--:--';
            } else {
              el.textContent = formatDuration(secondsPerKm * STATS[i].km);
            }
          }
        }

        function update() {
          var seconds = parsePace(input.value);
          if (seconds === null) {
            result.textContent = '--:--';
            updateStats(null);
            return;
          }
          var converted = isKmToMile ? seconds * KM_IN_MILE : seconds / KM_IN_MILE;
          result.textContent = formatPace(converted);
          var secondsPerKm = isKmToMile ? seconds : seconds / KM_IN_MILE;
          updateStats(secondsPerKm);
        }

        function applyUnits() {
          fromUnit.textContent = isKmToMile ? 'min/km' : 'min/mile';
          toUnit.textContent = isKmToMile ? 'min/mile' : 'min/km';
        }

        input.addEventListener('input', function (e) {
          var cleaned = e.target.value.replace(/[^0-9:]/g, '');
          if (cleaned !== e.target.value) e.target.value = cleaned;
          update();
        });

        swapBtn.addEventListener('click', function () {
          var currentResult = result.textContent;
          if (currentResult && currentResult !== '--:--') {
            input.value = currentResult;
          }
          isKmToMile = !isKmToMile;
          applyUnits();
          update();
        });

        applyUnits();
        update();
      })();
    </script>
  </body>
</html>
